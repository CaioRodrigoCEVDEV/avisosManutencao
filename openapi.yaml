openapi: 3.0.3
info:
  title: maintenance-api
  description: |
    API de mensagens de manutenção programada com painel administrativo.

    A **API pública** (`/api/maintenance`) não exige autenticação e é consumida
    por sistemas externos. Os endpoints **administrativos** (`/api/admin`,
    `/api/auth`) exigem autenticação por cookie `HttpOnly` com JWT.
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Desenvolvimento
  - url: https://avisos.orderup.com.br
    description: Produção

tags:
  - name: Health
  - name: Public
  - name: Auth
  - name: Admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Serviço disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: maintenance-api
                  timestamp:
                    type: string
                    format: date-time

  /api/maintenance:
    get:
      tags: [Public]
      summary: Manutenção ativa no momento
      description: Retorna a manutenção habilitada que cobre o instante atual.
      security: []
      responses:
        "200":
          description: Estado atual da manutenção
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMaintenance"
              examples:
                ativa:
                  value:
                    id: "b3f1c2a4-5d6e-4f70-8a91-2c3d4e5f6a7b"
                    ativo: true
                    inicio: "2026-09-20T22:00:00-03:00"
                    fim: "2026-09-20T23:30:00-03:00"
                    titulo: Manutenção programada
                    mensagem: O sistema ficará indisponível durante este período.
                vazia:
                  value:
                    id: null
                    ativo: false
                    inicio: null
                    fim: null
                    titulo: null
                    mensagem: null

  /api/maintenance/next:
    get:
      tags: [Public]
      summary: Próxima manutenção ainda não iniciada
      security: []
      responses:
        "200":
          description: Próxima manutenção programada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMaintenance"
              examples:
                proxima:
                  value:
                    id: "b3f1c2a4-5d6e-4f70-8a91-2c3d4e5f6a7b"
                    ativo: false
                    inicio: "2026-09-20T22:00:00-03:00"
                    fim: "2026-09-20T23:30:00-03:00"
                    titulo: Manutenção programada
                    mensagem: O sistema ficará indisponível durante este período.
                vazia:
                  value:
                    id: null
                    ativo: false
                    inicio: null
                    fim: null
                    titulo: null
                    mensagem: null

  /api/maintenance/{id}:
    get:
      tags: [Public]
      summary: Manutenção pelo ID, independente da janela de início/fim
      description: |
        Retorna uma manutenção específica pelo ID sem autenticação,
        independentemente da janela de início/fim e do flag `active`.
        O campo `ativo` continua sendo calculado pela janela real.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manutenção encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMaintenance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autentica o administrador
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: admin@localhost
                password:
                  type: string
                  example: admin123
      responses:
        "200":
          description: Login realizado; define o cookie HttpOnly
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login realizado com sucesso.
                  user:
                    $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Encerra a sessão
      security: []
      responses:
        "200":
          description: Logout realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout realizado com sucesso.

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Usuário autenticado
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sessão válida
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: true
                  user:
                    $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Altera a senha do usuário autenticado
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                confirmPassword:
                  type: string
      responses:
        "200":
          description: Senha alterada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Senha alterada com sucesso.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/dashboard:
    get:
      tags: [Admin]
      summary: Dados do dashboard
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Resumo
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/AdminMaintenance"
                  next:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/AdminMaintenance"
                  total:
                    type: integer
                  recent:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminMaintenance"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/maintenance:
    get:
      tags: [Admin]
      summary: Lista manutenções
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, active, inactive, scheduled, ongoing, finished]
            default: all
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminMaintenance"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin]
      summary: Cria manutenção
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceInput"
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMaintenance"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/maintenance/{id}:
    parameters:
      - $ref: "#/components/parameters/MaintenanceId"
    get:
      tags: [Admin]
      summary: Obtém uma manutenção
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMaintenance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Admin]
      summary: Atualiza uma manutenção
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceUpdateInput"
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMaintenance"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      tags: [Admin]
      summary: Atualização parcial de uma manutenção
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceUpdateInput"
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMaintenance"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Admin]
      summary: Exclui uma manutenção
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Excluída
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/maintenance/{id}/status:
    parameters:
      - $ref: "#/components/parameters/MaintenanceId"
    patch:
      tags: [Admin]
      summary: Ativa ou desativa uma manutenção
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMaintenance"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: maintenance_auth

  parameters:
    MaintenanceId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    PublicMaintenance:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Identificador do aviso (nulo quando não há manutenção)
          example: "b3f1c2a4-5d6e-4f70-8a91-2c3d4e5f6a7b"
        ativo:
          type: boolean
        inicio:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-20T22:00:00-03:00"
        fim:
          type: string
          format: date-time
          nullable: true
        titulo:
          type: string
          nullable: true
        mensagem:
          type: string
          nullable: true
      required: [id, ativo, inicio, fim, titulo, mensagem]

    SessionUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string

    AdminMaintenance:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        active:
          type: boolean
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, ongoing, finished, inactive]

    MaintenanceInput:
      type: object
      description: |
        Aceita datas ISO em `startAt`/`endAt` (ou aliases `inicio`/`fim`,
        `start`/`end`) **ou** data e hora separadas em
        `startDate`+`startTime` e `endDate`+`endTime`, interpretadas em
        `APP_TIMEZONE`.
      required: [title, message]
      properties:
        title:
          type: string
          maxLength: 150
        message:
          type: string
          maxLength: 5000
        active:
          type: boolean
          default: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        startDate:
          type: string
          example: "2026-09-20"
        startTime:
          type: string
          example: "22:00"
        endDate:
          type: string
          example: "2026-09-20"
        endTime:
          type: string
          example: "23:30"

    MaintenanceUpdateInput:
      allOf:
        - $ref: "#/components/schemas/MaintenanceInput"
      description: Todos os campos são opcionais; envie ao menos um.

    Error:
      type: object
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          nullable: true

  responses:
    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: VALIDATION_ERROR
            message: Os dados enviados são inválidos.
    Unauthorized:
      description: Autenticação necessária
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: UNAUTHORIZED
            message: Autenticação necessária.
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: NOT_FOUND
            message: Manutenção não encontrada.
    Conflict:
      description: Conflito de períodos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: MAINTENANCE_CONFLICT
            message: Já existe uma manutenção ativa neste período.
    TooManyRequests:
      description: Muitas requisições
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: TOO_MANY_REQUESTS
            message: Muitas tentativas de login. Tente novamente em 15 minutos.
