<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manutenções · Painel de Manutenções</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/admin/css/admin.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/admin">
          <span class="brand-badge">M</span> Manutenções
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#adminNavbar"
          aria-controls="adminNavbar"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/admin">Dashboard</a></li>
            <li class="nav-item">
              <a class="nav-link active" href="/admin/maintenance">Manutenções</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="/admin/settings">Configurações</a></li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <span class="text-white-50 small">Olá, <span data-user-name>...</span></span>
            <button class="btn btn-outline-light btn-sm" id="logout-button">Sair</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="page-alert"></div>

      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
          <h1 class="h3 mb-1">Manutenções</h1>
          <p class="text-muted mb-0">Cadastre e gerencie as janelas de manutenção.</p>
        </div>
        <a href="/admin/maintenance/new" class="btn btn-brand">+ Nova manutenção</a>
      </div>

      <div class="card">
        <div class="card-header bg-white">
          <div class="row g-2 align-items-center">
            <div class="col-12 col-md-auto">
              <label for="filter" class="col-form-label fw-semibold">Filtrar</label>
            </div>
            <div class="col-12 col-md-4">
              <select class="form-select" id="filter">
                <option value="all">Todas</option>
                <option value="active">Ativas</option>
                <option value="inactive">Inativas</option>
                <option value="scheduled">Programadas</option>
                <option value="ongoing">Em andamento</option>
                <option value="finished">Encerradas</option>
              </select>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Título</th>
                <th>Início</th>
                <th>Fim</th>
                <th>Status</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody id="maintenance-body">
              <tr>
                <td colspan="5" class="text-center text-muted py-4">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/admin/js/auth.js"></script>
    <script src="/admin/js/maintenance.js"></script>
  </body>
</html>
