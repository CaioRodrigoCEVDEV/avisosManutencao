<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · Painel de Manutenções</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/admin/css/admin.css" />
  </head>
  <body>
    <main class="login-wrapper">
      <div class="card login-card">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <span class="brand-badge">M</span>
            <h1 class="h4 mt-2 mb-1">Painel de Manutenções</h1>
            <p class="text-muted mb-0">Acesse com suas credenciais administrativas.</p>
          </div>

          <div id="login-alert"></div>

          <form id="login-form" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                autocomplete="username"
                required
              />
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Senha</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="btn btn-brand w-100" id="login-submit">
              Entrar
            </button>
          </form>
        </div>
      </div>
    </main>

    <script src="/admin/js/auth.js"></script>
    <script src="/admin/js/login.js"></script>
  </body>
</html>
