<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurações · Painel de Manutenções</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/admin/css/admin.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/admin">
          <span class="brand-badge">M</span> Manutenções
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#adminNavbar"
          aria-controls="adminNavbar"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/admin">Dashboard</a></li>
            <li class="nav-item">
              <a class="nav-link" href="/admin/maintenance">Manutenções</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/admin/settings">Configurações</a>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <span class="text-white-50 small">Olá, <span data-user-name>...</span></span>
            <button class="btn btn-outline-light btn-sm" id="logout-button">Sair</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="page-alert"></div>

      <div class="mb-4">
        <h1 class="h3 mb-1">Configurações</h1>
        <p class="text-muted mb-0">Gerencie sua conta e segurança.</p>
      </div>

      <div class="row g-4">
        <div class="col-12 col-lg-5">
          <div class="card">
            <div class="card-header bg-white"><strong>Dados da conta</strong></div>
            <div class="card-body">
              <p class="mb-2"><strong>Nome:</strong> <span id="account-name">-</span></p>
              <p class="mb-0"><strong>Email:</strong> <span id="account-email">-</span></p>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-7">
          <div class="card">
            <div class="card-header bg-white"><strong>Alterar senha</strong></div>
            <div class="card-body">
              <form id="password-form" novalidate>
                <div class="mb-3">
                  <label for="currentPassword" class="form-label">Senha atual</label>
                  <input
                    type="password"
                    class="form-control"
                    id="currentPassword"
                    autocomplete="current-password"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="newPassword" class="form-label">Nova senha</label>
                  <input
                    type="password"
                    class="form-control"
                    id="newPassword"
                    autocomplete="new-password"
                    minlength="8"
                    required
                  />
                  <div class="form-text">Mínimo de 8 caracteres.</div>
                </div>
                <div class="mb-4">
                  <label for="confirmPassword" class="form-label">Confirmar nova senha</label>
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    autocomplete="new-password"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-brand" id="password-button">
                  Alterar senha
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/admin/js/auth.js"></script>
    <script src="/admin/js/settings.js"></script>
  </body>
</html>
